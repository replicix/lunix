[package]
name = "lunix-ublk"
description = "Raw ublk control ring, queues, recovery, QUIESCE, TRY_STOP and resize."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Compiled out unless on (see lunix_iface::crashpoint): `ublk.after_fetch` and
# `ublk.before_commit`. The root harness builds the test daemon with it.
crashpoints = ["lunix-iface/crashpoints"]

[[bin]]
name = "lunix-ublk-testd"
path = "src/bin/lunix-ublk-testd/main.rs"

[dependencies]
lunix-format.workspace = true
lunix-iface.workspace = true
thiserror.workspace = true
libublk.workspace = true
io-uring.workspace = true
libc.workspace = true
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
lunix-testkit.workspace = true
