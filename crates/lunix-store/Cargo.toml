[package]
name = "lunix-store"
description = "Volume directory, segments, map packs, commit and checkpoint files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lunix-format.workspace = true
lunix-iface.workspace = true
thiserror.workspace = true
blake3.workspace = true
crc32c.workspace = true
zstd.workspace = true
replicix-platform-lite.workspace = true
rustix.workspace = true
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
lunix-testkit.workspace = true
# The crash-sweep tests re-run the test binary with LUNIX_CRASH_AT set, which needs the
# registry compiled in. A dev-dependency edge is outside the normal/build tree that
# tools/check-features.sh inspects.
lunix-iface = { workspace = true, features = ["crashpoints"] }
