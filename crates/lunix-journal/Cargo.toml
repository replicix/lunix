[package]
name = "lunix-journal"
description = "Journal lanes, group commit, recovery scan and reclaim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Compiled out unless on (see lunix_iface::crashpoint); only the crash-point
# tests of this crate and the lunixd crashpoints build enable it.
crashpoints = ["lunix-iface/crashpoints"]

[dependencies]
lunix-format.workspace = true
lunix-iface.workspace = true
thiserror.workspace = true
crc32c.workspace = true
libc.workspace = true
rustix.workspace = true
io-uring.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
lunix-testkit.workspace = true
