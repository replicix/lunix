[package]
name = "lunix-index"
description = "Chunk index (LSM runs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Compiled out unless on (see lunix_iface::crashpoint); the kill tests of
# `rebuild` and the lunixd crashpoints build enable it.
crashpoints = ["lunix-iface/crashpoints"]

[dependencies]
lunix-format.workspace = true
lunix-iface.workspace = true
thiserror.workspace = true
blake3.workspace = true
crc32c.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
lunix-testkit.workspace = true
