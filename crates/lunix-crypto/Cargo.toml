[package]
name = "lunix-crypto"
description = "Key hierarchy, extent AEAD, metadata sealing, keyring and the attach downgrade check."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Deterministic salt source for known-answer tests; never enabled outside dev-dependencies.
test-rng = []
# Tripwire used by the redaction tests; never enabled outside dev-dependencies.
tripwire = []

[dependencies]
lunix-format.workspace = true
lunix-iface.workspace = true
thiserror.workspace = true
blake3.workspace = true
aws-lc-rs.workspace = true
chacha20poly1305.workspace = true
argon2 = { workspace = true, features = ["zeroize"] }
hmac.workspace = true
sha2.workspace = true
zeroize.workspace = true
lz4_flex.workspace = true
zstd.workspace = true
# mlock/madvise of the key arena (the plan's only other unsafe, besides one test).
rustix.workspace = true

[dev-dependencies]
proptest.workspace = true
hex.workspace = true
serde_json.workspace = true
# The test-only features reach the crate's own unit and integration tests through this
# dev edge; tools/check-features.sh looks at normal and build edges only.
lunix-crypto = { workspace = true, features = ["test-rng", "tripwire"] }
