[package]
name = "lunix-destage"
description = "Zero, hash, dedup, compress, seal, pack and map update."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Compiles the crash points in (tests only; never on a normal build).
crashpoints = ["lunix-iface/crashpoints"]

[dependencies]
lunix-format.workspace = true
lunix-iface.workspace = true
thiserror.workspace = true
blake3.workspace = true
lz4_flex.workspace = true
zstd.workspace = true
replicix-chunkfmt.workspace = true

[dev-dependencies]
proptest.workspace = true
lunix-testkit.workspace = true
# The real extent codecs, for the determinism and key-separation gates (M2 is merged).
lunix-crypto.workspace = true
