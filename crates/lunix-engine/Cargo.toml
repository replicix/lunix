[package]
name = "lunix-engine"
description = "I/O handlers, flush groups, cut and commit, startup recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Compiled out unless on (see lunix_iface::crashpoint); only lunixd's
# crashpoints build enables it.
crashpoints = ["lunix-iface/crashpoints"]
# Test hooks (`Engine::hold_coordinator`); lunixd's `testsupport` turns it on.
testsupport = []

[dependencies]
lunix-format.workspace = true
lunix-iface.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
lunix-testkit.workspace = true
