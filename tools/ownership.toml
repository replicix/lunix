# M12a creates src/testsupport.rs with its final signature; M12b fills it.
[m12a]
paths = ["crates/lunixd/**"]
exclude = ["crates/lunixd/tests/stack_*.rs"]

[m12b]
paths = [
  "crates/lunixd/tests/stack_*.rs",
  "crates/lunixd/src/testsupport.rs",
]

# M13a owns all of lunix-cli, including the stubs of src/fsck.rs and
# src/key.rs; M13b fills only those two files.
[m13a]
paths = ["crates/lunix-cli/**"]

