name: ci

on:
  push:
    branches: [main, "p1/**"]
  pull_request:

# Unprivileged tests only: nothing here loads ublk_drv or runs as root.
# Root, ublk and performance runs happen on the test host (tools/remote.sh).
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUNIX_ON_HOST: "1"
      LUNIX_JOBS: "4"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain (rust-toolchain.toml pins the channel)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Gate (fmt, clippy, tests, feature edges, ownership)
        env:
          # Milestone branches are named p1/<milestone>; main has no milestone.
          LUNIX_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          # check-ownership needs a milestone id; skip it off milestone branches.
          if [[ "$LUNIX_BRANCH" != p1/* ]]; then
            export LUNIX_SKIP_OWNERSHIP=1
          fi
          git fetch origin main:refs/remotes/origin/main || true
          git branch -f main origin/main || true
          bash tools/ci.sh
